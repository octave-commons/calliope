name: Verify PR 3 Readiness Metadata

permissions:
  contents: read

on:
  push:
    branches: [design/media-workbench-v1]
    paths:
      - ".github/workflows/verify-pr3-readiness-metadata.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/verify-pr3-readiness-metadata.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/media-workbench-v1
          persist-credentials: false

      - name: Validate current card corpus
        run: python3 scripts/validate_rheos_board.py

      - name: Reject malformed ready card
        shell: bash
        run: |
          set -euo pipefail
          fixture="docs/kanban/stories/nested/malformed-ready.md"
          mkdir -p "$(dirname "$fixture")"
          cat > "$fixture" <<'EOF'
---
uuid: "malformed-ready"
status: ready
owner: unassigned
points: 1
adr: "docs/adrs/does-not-exist.md"
---

# Malformed ready card
EOF

          if python3 scripts/validate_rheos_board.py > /tmp/ready-out 2> /tmp/ready-err; then
            echo "malformed ready card unexpectedly passed" >&2
            exit 1
          fi

          grep -F "active card missing title" /tmp/ready-err
          grep -F "active card missing type" /tmp/ready-err
          grep -F "active card missing priority" /tmp/ready-err
          grep -F "active card missing phase" /tmp/ready-err
          grep -F "active card missing category" /tmp/ready-err
          grep -F "active card missing section 'Outcome'" /tmp/ready-err
          grep -F "active card missing section 'Scope'" /tmp/ready-err
          grep -F "active card missing section 'Non-goals'" /tmp/ready-err
          grep -F "active card missing section 'Acceptance criteria'" /tmp/ready-err
          grep -F "active card missing section 'Verification'" /tmp/ready-err
          grep -F "adr 'docs/adrs/does-not-exist.md' does not resolve to a file" /tmp/ready-err

          rm "$fixture"
          rmdir docs/kanban/stories/nested
          python3 scripts/validate_rheos_board.py
