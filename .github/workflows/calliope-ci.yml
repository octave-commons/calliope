name: Calliope CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Calliope kondo lint + JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure CLI, Babashka and clj-kondo
        uses: DeLaGuardo/setup-clojure@ada62bb3282a01a296659d48378b812b8e097360
        with:
          cli: "1.12.5.1654"
          bb: "1.13.219"
          clj-kondo: "2025.10.23"

      - name: Cache Maven and gitlibs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn') }}

      - name: Lint Calliope
        run: clj-kondo --lint src test scripts --fail-level error

      - name: Test Calliope (JVM; :metrics and the DSP lane are excluded)
        run: clojure -M:test
