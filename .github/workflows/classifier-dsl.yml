name: Repository Contracts

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "PROCESS.md"
      - "deps.edn"
      - "bb.edn"
      - "scripts/media.clj"
      - "scripts/corpus.clj"
      - "docs/classifier-dsl.md"
      - "docs/harnesses/**"
      - "docs/research/**"
      - "docs/adrs/**"
      - "docs/designs/**"
      - "docs/process/**"
      - "docs/kanban/**"
      - "docs/kanban-docs/**"
      - "openhax.kanban.json"
      - "spike/**"
      - ".opencode/AGENTS.md"
      - ".opencode/skills/calliope-corpus/SKILL.md"
      - "src/calliope/**"
      - "resources/classifiers/**"
      - "test/calliope/**"
      - ".github/workflows/classifier-dsl.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "PROCESS.md"
      - "deps.edn"
      - "bb.edn"
      - "scripts/media.clj"
      - "scripts/corpus.clj"
      - "docs/classifier-dsl.md"
      - "docs/harnesses/**"
      - "docs/research/**"
      - "docs/adrs/**"
      - "docs/designs/**"
      - "docs/process/**"
      - "docs/kanban/**"
      - "docs/kanban-docs/**"
      - "openhax.kanban.json"
      - "spike/**"
      - ".opencode/AGENTS.md"
      - ".opencode/skills/calliope-corpus/SKILL.md"
      - "src/calliope/**"
      - "resources/classifiers/**"
      - "test/calliope/**"
      - ".github/workflows/classifier-dsl.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install canonical Rheos
        run: npm install --global @eta-mu/rheos@0.2.0
      - name: Read board through Rheos
        run: |
          rheos read-board > "$RUNNER_TEMP/rheos-board.json"
          rheos read-task ft-000b-define-media-workbench-domain-laws
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: 1.12.2.1565
          bb: 1.13.219
          clj-kondo: 2025.07.28
      - name: Run Clojure tests
        run: clojure -M:test
      - name: Lint Clojure sources
        run: clj-kondo --lint src test spike
      - name: Verify Clio through independent JVMs
        working-directory: spike/clio-consumer
        run: |
          clojure -M -m clio-probe append "$RUNNER_TEMP/calliope-clio-probe"
          clojure -M -m clio-probe recover "$RUNNER_TEMP/calliope-clio-probe"
