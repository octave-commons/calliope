name: Verify Reconstruction Integration

permissions:
  contents: read

on:
  push:
    branches: [integrate/reconstruction-media-workbench]
    paths:
      - ".github/workflows/integrate-reconstruction.yml"
  pull_request:
    branches: [design/media-workbench-v1]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/integrate-reconstruction.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/reconstruction-media-workbench
          fetch-depth: 0
          persist-credentials: false

      - name: Verify ancestry, receipt union, and exclusions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin design/classifier-dsl-v1 design/media-workbench-v1
          git merge-base --is-ancestor origin/design/classifier-dsl-v1 HEAD
          git merge-base --is-ancestor origin/design/media-workbench-v1 HEAD

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          current = Path("receipts.edn").read_text(encoding="utf-8").splitlines()
          current_nonblank = [line for line in current if line]
          if len(current_nonblank) != len(set(current_nonblank)):
              raise SystemExit("integrated receipts.edn contains duplicate nonblank rows")

          for ref in ["origin/design/classifier-dsl-v1", "origin/design/media-workbench-v1"]:
              source = subprocess.check_output(
                  ["git", "show", f"{ref}:receipts.edn"], text=True
              ).splitlines()
              missing = [line for line in source if line and line not in current_nonblank]
              if missing:
                  raise SystemExit(f"{ref}: {len(missing)} receipt rows missing from integration")
              print(f"{ref}: {len([line for line in source if line])} receipt rows preserved")

          print(f"integrated receipts.edn: {len(current_nonblank)} unique rows")
          PY

          test ! -e .cpcache
          test ! -e .ημ/session-mycology
          test -f docs/reconstruction/README.md
          test -f references/heresy-between/RENDERS-MANIFEST.edn
          test -f docs/kanban/stories/ft-003e-index-reconstruction-evidence.md
