name: Append PR 3 Readiness Receipt

permissions:
  contents: write

on:
  push:
    branches: [design/media-workbench-v1]
    paths:
      - ".github/workflows/append-pr3-readiness-receipt.yml"

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/media-workbench-v1
          fetch-depth: 0

      - name: Append Receipt River row
        shell: bash
        run: |
          set -euo pipefail
          marker='Close the post-fix active-card readiness finding'
          if grep -Fq "$marker" receipts.edn; then
            echo "Receipt already present"
            exit 1
          fi
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '%s\n' "{:ts \"${ts}\", :kind :build, :repo \"https://github.com/octave-commons/fork_tales_v2\", :origin \"github-actions\", :owner \"gpt-5.6-thinking\", :dod \"Close the post-fix active-card readiness finding by enforcing the complete board contract and normalizing legacy active cards.\", :pi \"eta-mu/receipt-river-v1\", :host \"github-actions/ubuntu-latest\", :manifest \"PR #3; scripts/validate_rheos_board.py; FT-000 through FT-003 epics; FT-000A; FT-OPS-002; FT-OPS-003; review thread PRRT_kwDOTkaDCs6UkPkK\", :refs \"substantive tested head 646f18b70872d4de70033ea3070522777eb3c6fb; Repository Contracts run 30404941742; readiness verifier run 30404941728\", :tests \"Repository Contracts passed. The current 27-card board passed. A synthetic ready card with only uuid/status/owner/points plus a nonexistent ADR was rejected for missing title, type, priority, phase, category, Outcome, Scope, Non-goals, Acceptance criteria, Verification, and for the unresolved ADR path.\", :decisions \"Cards outside icebox/incoming must declare stable readiness frontmatter, positive points, exact lifecycle sections, at least one governing authority link, and resolvable repository-relative authority paths. Declared type must match category. Legacy active epics and completed governance cards were normalized without changing their status or accepted disposition.\", :note \"Remote GitHub work only. The temporary verifier and receipt workflow are removed after use. No user-local Rheos or audio command was invoked.\"}" >> receipts.edn

      - name: Commit receipt only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipts.edn
          git commit -m "docs: record active-card readiness fix"
          git push origin HEAD:design/media-workbench-v1
