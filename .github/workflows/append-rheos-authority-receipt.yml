name: Append Rheos Authority Receipt

permissions:
  contents: write

on:
  push:
    branches: [design/media-workbench-v1]
    paths:
      - ".github/workflows/append-rheos-authority-receipt.yml"

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/media-workbench-v1
          fetch-depth: 0
      - name: Append Receipt River adjudication
        shell: bash
        run: |
          set -euo pipefail
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{:ts "%s", :kind :adjudication, :repo "https://github.com/octave-commons/fork_tales_v2", :origin "github-actions", :owner "gpt-5.6-thinking", :host "github-actions/ubuntu-latest", :pi "eta-mu/receipt-river-v1", :dod "Remove the repository-local Rheos validator and make eta-mu/Rheos the sole board implementation after explicit human correction.", :manifest ".github/workflows/classifier-dsl.yml; scripts/validate_rheos_board.py removed; AGENTS.md; docs/kanban-docs/AGENTS.md; docs/kanban-docs/README.md; docs/kanban-docs/BOARD-BREAKDOWN.md; docs/process/product-design-and-delivery.md; PR #3", :refs "PR #3; tested head d90dd6945db734e0263a0239ee6a6cd3d5441dea; Repository Contracts run 30405858128; explicit user correction in ChatGPT", :tests "GitHub Actions installed eta-mu 1.1.1, ran eta-mu kanban count/list/find directly, discovered 27 cards, and clojure -M:test passed 23 tests with 91 assertions and zero failures or errors.", :decisions "Rheos is the sole board operational authority. Fork Tales must not create local board parsers, validators, migration scripts, writeback helpers, shadow FSMs, WIP checkers, or alternate APIs. Missing behavior is fixed upstream. Harnesses without Rheos do not mutate or certify board state.", :drift "The deleted Python validator and copied FSM, WIP, and write rules were a parallel board implementation and therefore architectural drift. Earlier receipts remain append-only history and are superseded on this point.", :note "Remote GitHub work only. No user-local Rheos, native UI, audio device, or playback command was invoked."}\n' "$ts" >> receipts.edn
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipts.edn
          git commit -m "docs: record Rheos sole-authority adjudication"
          git push origin HEAD:design/media-workbench-v1
