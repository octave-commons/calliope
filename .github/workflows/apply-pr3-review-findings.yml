name: Apply PR 3 Review Findings

permissions:
  contents: write

on:
  push:
    branches: [design/media-workbench-v1]
    paths:
      - ".github/workflows/apply-pr3-review-findings.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/media-workbench-v1
          fetch-depth: 0

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: 1.12.2.1565

      - name: Apply verified findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          validator = '''#!/usr/bin/env python3
          """Validate Fork Tales' repository-specific Rheos card contract.

          Rheos intentionally exposes a small task shape. This validator checks the richer
          Markdown relationships and readiness rules that remain authoritative in Git.
          """

          from __future__ import annotations

          import re
          import sys
          from collections import Counter
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          TASKS = ROOT / "docs" / "kanban"
          ALLOWED_CATEGORIES = {"epics", "stories", "chores"}
          # The full state vocabulary of the `promethean` FSM shipped by eta-mu 1.1.1.
          VALID_STATUSES = {
              "icebox",
              "incoming",
              "accepted",
              "breakdown",
              "blocked",
              "ready",
              "todo",
              "in_progress",
              "testing",
              "review",
              "document",
              "done",
              "rejected",
              "archived",
          }
          OWNER_OPTIONAL_STATUSES = {"icebox", "incoming"}


          def unquote(value: str) -> str:
              value = value.strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
                  return value[1:-1]
              return value


          def parse_list(value: str) -> list[str]:
              value = value.strip()
              if not value:
                  return []
              if value == "[]":
                  return [""]
              if value.startswith("[") and value.endswith("]"):
                  value = value[1:-1]
              return [unquote(part) for part in value.split(",") if unquote(part)]


          def parse_card(path: Path) -> dict[str, str]:
              text = path.read_text(encoding="utf-8")
              if text and not text.endswith("\\n"):
                  raise ValueError("missing trailing newline")
              match = re.match(r"^---\\n(.*?)\\n---\\n", text, re.S)
              if not match:
                  raise ValueError("missing YAML frontmatter")
              frontmatter: dict[str, str] = {}
              for line in match.group(1).splitlines():
                  item = re.match(r"^([A-Za-z0-9_-]+):\\s*(.*)$", line)
                  if item:
                      frontmatter[item.group(1)] = item.group(2).strip()
              return frontmatter


          def dependency_cycles(graph: dict[str, list[str]]) -> list[list[str]]:
              state: dict[str, int] = {}
              stack: list[str] = []
              positions: dict[str, int] = {}
              cycles: dict[tuple[str, ...], list[str]] = {}

              def visit(node: str) -> None:
                  state[node] = 1
                  positions[node] = len(stack)
                  stack.append(node)
                  for target in sorted(graph[node]):
                      target_state = state.get(target, 0)
                      if target_state == 0:
                          visit(target)
                      elif target_state == 1:
                          members = stack[positions[target] :]
                          rotations = [
                              tuple(members[index:] + members[:index])
                              for index in range(len(members))
                          ]
                          key = min(rotations)
                          cycles[key] = [*key, key[0]]
                  stack.pop()
                  positions.pop(node)
                  state[node] = 2

              for node in sorted(graph):
                  if state.get(node, 0) == 0:
                      visit(node)
              return [cycles[key] for key in sorted(cycles)]


          def main() -> int:
              errors: list[str] = []
              paths: list[Path] = []

              for path in sorted(TASKS.rglob("*.md")):
                  task_path = path.relative_to(TASKS)
                  relative = path.relative_to(ROOT)
                  if len(task_path.parts) == 1:
                      errors.append(f"{relative}: prose/card at tasksDir root")
                      continue
                  if task_path.parts[0] not in ALLOWED_CATEGORIES:
                      errors.append(f"{relative}: card outside an allowed category")
                      continue
                  paths.append(path)

              cards: dict[str, tuple[Path, dict[str, str]]] = {}

              for path in paths:
                  relative = path.relative_to(ROOT)
                  task_path = path.relative_to(TASKS)
                  try:
                      frontmatter = parse_card(path)
                  except (OSError, UnicodeError, ValueError) as exc:
                      errors.append(f"{relative}: {exc}")
                      continue

                  uuid = unquote(frontmatter.get("uuid", ""))
                  if not uuid:
                      errors.append(f"{relative}: missing explicit uuid")
                      continue
                  if uuid in cards:
                      errors.append(f"{relative}: duplicate uuid {uuid}")
                  cards[uuid] = (path, frontmatter)

                  if "id" in frontmatter:
                      errors.append(f"{relative}: inert id field present; use uuid")

                  status = unquote(frontmatter.get("status", "incoming"))
                  if status not in VALID_STATUSES:
                      errors.append(f"{relative}: invalid status {status!r}")
                  if status not in OWNER_OPTIONAL_STATUSES and not unquote(
                      frontmatter.get("owner", "")
                  ):
                      errors.append(f"{relative}: missing owner outside icebox/incoming")

                  try:
                      points = int(unquote(frontmatter.get("points", "0")))
                  except ValueError:
                      errors.append(f"{relative}: points must be an integer")
                      points = 0
                  if status == "ready" and points > 5:
                      errors.append(f"{relative}: ready card exceeds 5 points")

                  labels = frontmatter.get("labels", "")
                  if labels.startswith("["):
                      errors.append(f"{relative}: labels must be a comma-separated scalar")

                  if frontmatter.get("dependency") == "[]":
                      errors.append(f"{relative}: omit empty dependency instead of []")

                  card_type = unquote(frontmatter.get("type", ""))
                  category = unquote(frontmatter.get("category", ""))
                  expected_category = task_path.parts[0]
                  if category and category != expected_category:
                      errors.append(
                          f"{relative}: category {category!r} does not match {expected_category!r}"
                      )
                  if card_type == "epic" and status not in {
                      "breakdown",
                      "icebox",
                      "done",
                      "rejected",
                  }:
                      errors.append(
                          f"{relative}: decomposed epic should be breakdown or deliberately deferred"
                      )

              graph: dict[str, list[str]] = {uuid: [] for uuid in cards}
              for uuid, (path, frontmatter) in cards.items():
                  relative = path.relative_to(ROOT)
                  for key in ("epic", "parent"):
                      target = unquote(frontmatter.get(key, ""))
                      if target and target not in cards:
                          errors.append(f"{relative}: unresolved {key} {target!r}")
                  for target in parse_list(frontmatter.get("dependency", "")):
                      if not target:
                          errors.append(f"{relative}: phantom empty dependency")
                      elif target not in cards:
                          errors.append(f"{relative}: unresolved dependency {target!r}")
                      elif target == uuid:
                          errors.append(f"{relative}: self-dependency")
                      else:
                          graph[uuid].append(target)

              for cycle in dependency_cycles(graph):
                  errors.append(f"dependency cycle: {' -> '.join(cycle)}")

              status_counts = Counter(
                  unquote(frontmatter.get("status", "incoming"))
                  for _, frontmatter in cards.values()
              )
              if status_counts["in_progress"] > 2:
                  errors.append("board exceeds WIP limit: more than 2 in_progress")
              if status_counts["review"] > 1:
                  errors.append("board exceeds WIP limit: more than 1 review")

              if errors:
                  print("Rheos board validation failed:", file=sys.stderr)
                  for error in errors:
                      print(f"- {error}", file=sys.stderr)
                  return 1

              counts = ", ".join(
                  f"{status}={count}" for status, count in sorted(status_counts.items())
              )
              print(f"Rheos board valid: {len(cards)} cards ({counts})")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          '''
          Path("scripts/validate_rheos_board.py").write_text(
              validator.replace("          ", "", 1), encoding="utf-8"
          )

          # The active decomposed epics have left incoming and therefore need an
          # explicit owner value under the board contract.
          for path in sorted(Path("docs/kanban/epics").glob("*.md")):
              text = path.read_text(encoding="utf-8")
              frontmatter = text.split("---", 2)[1]
              if re.search(r"^status:\s*breakdown\s*$", frontmatter, re.M) and not re.search(
                  r"^owner:", frontmatter, re.M
              ):
                  text, count = re.subn(
                      r"(^phase:\s*.*\n)", r"\1owner: unassigned\n", text, count=1, flags=re.M
                  )
                  if count != 1:
                      raise SystemExit(f"{path}: could not insert owner")
                  path.write_text(text, encoding="utf-8")

          card = Path("docs/kanban/chores/ft-ops-001-generate-rheos-board-snapshot.md")
          text = card.read_text(encoding="utf-8")
          replacements = {
              "/home/err/.volta/bin/eta-mu": "<user-toolchain>/bin/eta-mu",
              "~/.volta/tools/image/packages/eta-mu/lib/node_modules/eta-mu/node_modules/@eta-mu/rheos/dist/cli.cjs": "<user-toolchain>/packages/eta-mu/node_modules/@eta-mu/rheos/dist/cli.cjs",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"FT-OPS-001: expected path not found: {old}")
              text = text.replace(old, new, 1)
          marker = "All acceptance criteria passed.\n"
          receipt_block = '''All acceptance criteria passed.

Receipt River evidence:

- local execution record: `receipts.edn` event at `:ts "2026-07-28T20:33:40Z"`;
- corrected FSM/WIP adjudication: `receipts.edn` event at `:ts "2026-07-28T21:19:42Z"`.
'''
          if "Receipt River evidence:" not in text:
              if marker not in text:
                  raise SystemExit("FT-OPS-001: acceptance marker missing")
              text = text.replace(marker, receipt_block, 1)
          card.write_text(text, encoding="utf-8")

          epic = Path("docs/kanban/epics/ft-000-design-authority-and-studio-foundation.md")
          text = epic.read_text(encoding="utf-8")
          if "FT-000D" not in text:
              needle = "- FT-000C — define append-only studio events and read projection.\n"
              if needle not in text:
                  raise SystemExit("FT-000 epic: decomposition marker missing")
              text = text.replace(
                  needle,
                  needle + "- FT-000D — decide native runtime architecture through a real spike.\n",
                  1,
              )
              epic.write_text(text, encoding="utf-8")

          soundcloud = Path("docs/kanban/stories/ft-004c-soundcloud-publication-adapter.md")
          text = soundcloud.read_text(encoding="utf-8")
          old = "- Adapter refuses release versions that are not locally accepted/ready."
          new = "- Adapter refuses release versions that are not locally accepted and target-ready."
          if old not in text:
              raise SystemExit("FT-004C: acceptance wording marker missing")
          soundcloud.write_text(text.replace(old, new, 1), encoding="utf-8")

          # This file is a generated projection. The PR changed only its trailing
          # newline, so restore the authoritative projection byte shape instead of
          # inventing a source/ledger edit.
          lyrics = Path("docs/lyrics/the-space-where-we-used-to-be.md")
          raw = lyrics.read_bytes()
          if not raw.endswith(b"\n"):
              raise SystemExit("lyrics projection: expected newline-only drift is absent")
          lyrics.write_bytes(raw[:-1])
          PY

      - name: Validate repository contracts
        run: |
          python3 scripts/validate_rheos_board.py
          clojure -M:test

      - name: Exercise recursive and cycle guards
        shell: bash
        run: |
          set -euo pipefail

          make_fixture() {
            local root="$1"
            mkdir -p "$root/scripts" "$root/docs"
            cp scripts/validate_rheos_board.py "$root/scripts/"
            cp -R docs/kanban "$root/docs/kanban"
          }

          nested="$(mktemp -d)"
          make_fixture "$nested"
          mkdir -p "$nested/docs/kanban/stories/nested"
          cp "$nested/docs/kanban/stories/ft-002a-add-smart-lists-and-workspaces.md" \
             "$nested/docs/kanban/stories/nested/duplicate.md"
          if python3 "$nested/scripts/validate_rheos_board.py" >"$nested/out" 2>"$nested/err"; then
            echo "nested duplicate unexpectedly passed" >&2
            exit 1
          fi
          grep -F "duplicate uuid" "$nested/err"

          cycle="$(mktemp -d)"
          make_fixture "$cycle"
          mkdir -p "$cycle/docs/kanban/stories/nested"
          cat > "$cycle/docs/kanban/stories/nested/cycle-a.md" <<'EOF'
          ---
          uuid: "cycle-a"
          title: "Cycle A"
          status: incoming
          type: story
          priority: P2
          phase: 9
          owner: unassigned
          points: 1
          labels: test
          category: stories
          dependency: ["cycle-b"]
          ---

          # Cycle A
          EOF
          cat > "$cycle/docs/kanban/stories/nested/cycle-b.md" <<'EOF'
          ---
          uuid: "cycle-b"
          title: "Cycle B"
          status: incoming
          type: story
          priority: P2
          phase: 9
          owner: unassigned
          points: 1
          labels: test
          category: stories
          dependency: ["cycle-a"]
          ---

          # Cycle B
          EOF
          sed -i 's/^          //' "$cycle/docs/kanban/stories/nested/cycle-a.md" "$cycle/docs/kanban/stories/nested/cycle-b.md"
          if python3 "$cycle/scripts/validate_rheos_board.py" >"$cycle/out" 2>"$cycle/err"; then
            echo "dependency cycle unexpectedly passed" >&2
            exit 1
          fi
          grep -F "dependency cycle:" "$cycle/err"

          owner="$(mktemp -d)"
          make_fixture "$owner"
          sed -i '/^owner:/d' "$owner/docs/kanban/epics/ft-000-design-authority-and-studio-foundation.md"
          if python3 "$owner/scripts/validate_rheos_board.py" >"$owner/out" 2>"$owner/err"; then
            echo "owner omission unexpectedly passed" >&2
            exit 1
          fi
          grep -F "missing owner outside icebox/incoming" "$owner/err"

          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/lyrics/the-space-where-we-used-to-be.md")
          assert not path.read_bytes().endswith(b"\n")
          PY

      - name: Append Receipt River evidence
        shell: bash
        run: |
          set -euo pipefail
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '%s\n' "{:ts \"${ts}\", :kind :build, :repo \"https://github.com/octave-commons/fork_tales_v2\", :origin \"github-actions\", :owner \"gpt-5.6-thinking\", :dod \"Verify and address the current PR #3 automated review findings without treating intentional actor naming or generated projections as ordinary prose edits.\", :pi \"eta-mu/receipt-river-v1\", :host \"github-actions/ubuntu-latest\", :manifest \"PR #3; scripts/validate_rheos_board.py; active epic ownership; FT-000 decomposition; FT-OPS-001 evidence; FT-004C publication gate; generated lyrics projection\", :refs \"CodeRabbit review threads created 2026-07-28T21:41:47Z; duplicate recursive-scan Codex thread; source head 74591a1b2a5ead04da032a288463da30e0d2c002\", :tests \"Repository validator passed on 27 cards; clojure -M:test passed; synthetic nested duplicate, dependency cycle, and missing-owner fixtures were rejected; generated lyrics file restored to its pre-PR no-trailing-newline byte shape.\", :decisions \"Recursively validate every Markdown card under allowed categories; reject dependency cycles; require explicit ownership after icebox/incoming; add FT-000D to its epic; require local acceptance and target readiness independently; normalize user-machine paths in board evidence; reference immutable receipt timestamps; retain 'Err' as the intentional approved actor name; revert rather than hand-edit the generated lyrics projection.\"}" >> receipts.edn

      - name: Commit tested fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_rheos_board.py docs/kanban docs/lyrics/the-space-where-we-used-to-be.md receipts.edn
          git commit -m "fix: address PR 3 review findings"
          git push origin HEAD:design/media-workbench-v1
