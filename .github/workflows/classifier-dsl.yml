name: Repository Contracts

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "PROCESS.md"
      - "deps.edn"
      - "docs/classifier-dsl.md"
      - "docs/harnesses/**"
      - "docs/research/**"
      - "docs/adrs/**"
      - "docs/designs/**"
      - "docs/process/**"
      - "docs/kanban/**"
      - "docs/kanban-docs/**"
      - "openhax.kanban.json"
      - "scripts/validate_rheos_board.py"
      - ".opencode/AGENTS.md"
      - ".opencode/skills/fork-tales-corpus/SKILL.md"
      - "src/fork_tales/**"
      - "resources/classifiers/**"
      - "test/fork_tales/**"
      - ".github/workflows/classifier-dsl.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "PROCESS.md"
      - "deps.edn"
      - "docs/classifier-dsl.md"
      - "docs/harnesses/**"
      - "docs/research/**"
      - "docs/adrs/**"
      - "docs/designs/**"
      - "docs/process/**"
      - "docs/kanban/**"
      - "docs/kanban-docs/**"
      - "openhax.kanban.json"
      - "scripts/validate_rheos_board.py"
      - ".opencode/AGENTS.md"
      - ".opencode/skills/fork-tales-corpus/SKILL.md"
      - "src/fork_tales/**"
      - "resources/classifiers/**"
      - "test/fork_tales/**"
      - ".github/workflows/classifier-dsl.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
          persist-credentials: false
      - name: Validate Rheos card graph
        run: python3 scripts/validate_rheos_board.py
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: 1.12.2.1565
      - name: Run Clojure tests
        run: clojure -M:test
