name: Append Reconstruction Integration Receipt

permissions:
  contents: write

on:
  push:
    branches: [integrate/reconstruction-media-workbench]
    paths:
      - ".github/workflows/append-reconstruction-integration-receipt.yml"

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/reconstruction-media-workbench
          fetch-depth: 0

      - name: Append Receipt River row
        shell: bash
        run: |
          set -euo pipefail
          marker='Integrate the preserved audio-reconstruction lineage with the accepted media-workbench branch'
          if grep -Fq "$marker" receipts.edn; then
            echo "Receipt already present"
            exit 1
          fi
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '%s\n' "{:ts \"${ts}\", :kind :decision, :repo \"https://github.com/octave-commons/fork_tales_v2\", :origin \"chatgpt\", :owner \"gpt-5.6-thinking\", :dod \"Integrate the preserved audio-reconstruction lineage with the accepted media-workbench branch without flattening provenance or importing accidental runtime artifacts.\", :pi \"eta-mu/receipt-river-v1\", :host \"github-actions/ubuntu-latest\", :manifest \"PR #4; reconstruction laws/programs/contracts/docs/ledgers/manifests/evidence; FT-003E; AGENTS.md reconciliation; receipt-history union; removal of .cpcache and .ημ/session-mycology\", :refs \"PR #4; substantive tested head 08934ff5051a2130aef7575da23406511dd41eee; integration run 30392493782; closeout tested head f3611ddb2818563088acb35c4dda8a39711ca2ad; verifier run 30392868638\", :tests \"Combined Rheos board valid with 28 cards; clojure -M:test passed 40 tests and 177 assertions; reconstruction law namespaces loaded; receipts.edn parsed 21 forms; RENDERS-MANIFEST.edn parsed 540 forms; closeout verifier preserved all 15 reconstruction-branch and 16 media-workbench receipt rows in 21 unique rows and proved both parent branches are ancestors.\", :decisions \"Use a stacked PR based on design/media-workbench-v1; preserve design/classifier-dsl-v1 ancestry; keep immutable reconstruction evidence and hash manifests; exclude generated .cpcache and session-mycology artifacts; treat reconstruction as a media-workbench capability; preserve observed/derived/provisional/accepted distinctions.\", :note \"Remote GitHub work only. No user-local Rheos, Demucs, OpenUTAU, Whisper, Gemma, DSP, audio device, or playback command was invoked. The temporary append workflow is removed by the connector after this receipt-only commit.\"}" >> receipts.edn

      - name: Commit receipt only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipts.edn
          git commit -m "docs: record reconstruction integration receipt"
          git push origin HEAD:integrate/reconstruction-media-workbench
