name: Classifier DSL

on:
  pull_request:
    paths:
      - "deps.edn"
      - "src/fork_tales/**"
      - "resources/classifiers/**"
      - "test/fork_tales/**"
      - ".github/workflows/classifier-dsl.yml"
  push:
    branches: [main]
    paths:
      - "deps.edn"
      - "src/fork_tales/**"
      - "resources/classifiers/**"
      - "test/fork_tales/**"
      - ".github/workflows/classifier-dsl.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: 1.12.2.1565
      - name: Run classifier DSL tests
        id: classifier-tests
        shell: bash
        run: |
          set +e
          clojure -M:test > classifier-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload classifier test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classifier-test-output
          path: classifier-test.log
      - name: Enforce classifier test result
        if: steps.classifier-tests.outputs.status != '0'
        run: |
          cat classifier-test.log
          exit 1
