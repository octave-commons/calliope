name: Classifier DSL

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: read

jobs:
  diagnose-review-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/classifier-dsl-v1
          show-progress: false

      - name: Apply reviewed changes in diagnostic mode
        id: apply
        continue-on-error: true
        run: |
          {
            python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-classifier-review-fixes.py")
          text = path.read_text()
          old = '''replace_once(
              "src/fork_tales/classifier/runtime.clj",
              "(get bindings :selected)",
              "input",
              "hydrate declared input")'''
          new = '''regex_once(
              "src/fork_tales/classifier/runtime.clj",
              r"\\(get bindings :selected\\)",
              "input",
              "hydrate declared input")'''
          print("hydrate helper block count", text.count(old))
          if text.count(old) != 1:
              raise SystemExit("hydrate migration block not found exactly once")
          path.write_text(text.replace(old, new, 1))
          PY
            python3 scripts/apply-classifier-review-fixes.py
            python3 - <<'PY'
          from pathlib import Path
          import re

          law = Path("src/fork_tales/law/classifier.cljc")
          text = law.read_text()
          pattern = r'(\[:step/op \[:= :hydrate\]\]\n)(\s*)(\[:step/resolver :keyword\])'
          replacement = r'\1\2[:step/input :keyword]\n\2\3'
          text, count = re.subn(pattern, replacement, text, count=1)
          print("hydrate schema matches", count)
          if count != 1:
              raise SystemExit(f"hydrate schema insertion expected once, found {count}")
          law.write_text(text)

          program = Path("resources/classifiers/theme-discovery-v1.edn")
          text = program.read_text()
          old = "{:step/op :hydrate\n      :step/resolver"
          new = "{:step/op :hydrate\n      :step/input :selected\n      :step/resolver"
          print("hydrate program matches", text.count(old))
          if text.count(old) != 2:
              raise SystemExit(f"expected two hydrate program steps, found {text.count(old)}")
          program.write_text(text.replace(old, new))
          PY
          } > classifier-review-apply.log 2>&1
          cat classifier-review-apply.log

      - name: Upload classifier apply log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classifier-review-apply-log
          path: classifier-review-apply.log
          if-no-files-found: error

      - name: Fail after diagnostic capture
        if: steps.apply.outcome == 'failure'
        run: exit 1
